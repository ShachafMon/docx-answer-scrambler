name: Build EXE

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_name: docx-answer-scrambler
            asset_name: docx-answer-scrambler.exe
          - os: macos-latest
            build_name: docx-answer-scrambler-mac
            asset_name: docx-answer-scrambler-mac
          - os: ubuntu-latest
            build_name: docx-answer-scrambler-linux
            asset_name: docx-answer-scrambler-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "${{ matrix.build_name }}" shuffle_all.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Linux desktop launcher
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: docx-answer-scrambler-linux.desktop
          path: docx-answer-scrambler-linux.desktop
